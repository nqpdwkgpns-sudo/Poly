name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polymarket-alpha-bot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: polymarket-alpha-bot/pnpm-lock.yaml
      - name: install
        run: pnpm install --no-frozen-lockfile
      - name: typecheck
        run: pnpm tsc --noEmit
      - name: test
        run: pnpm test

version: '3.9'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-bot
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    ports:
      - '3001:3001'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '5'

  dashboard:
    build:
      context: ./src/dashboard
      dockerfile: Dockerfile.dashboard
    container_name: polymarket-dashboard
    ports:
      - '80:80'
    depends_on:
      - bot
    restart: unless-stopped

volumes:
  data:
    driver: local

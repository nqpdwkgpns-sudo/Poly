version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymarket-alpha-bot:latest
    container_name: polymarket-alpha-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: polymarket-alpha-bot-dashboard:latest
    container_name: polymarket-alpha-bot-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - bot
